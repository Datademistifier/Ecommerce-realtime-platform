name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce_analytics'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce_analytics:
    staging:
      +schema: staging
      +materialized: view         # staging = views, cheap to update
      +tags: ["staging"]
    intermediate:
      +schema: intermediate
      +materialized: table        # intermediate = tables for performance
      +tags: ["intermediate"]
    marts:
      +schema: analytics          # marts land in analytics schema
      +materialized: table
      +tags: ["marts"]
      +post-hook:
        - "GRANT SELECT ON {{ this }} TO PUBLIC"

vars:
  # Controls how far back incremental models look
  lookback_days: 3
